<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA crew</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url('background-ca.jpg');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 12vh;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        .logos-container {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 20% 10%;
        }

        .logo-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none !important;
            position: relative;
            z-index: 11;
            cursor: pointer;
            touch-action: manipulation;
        }

        .logo-img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        /* DÒNG CHỮ NHÃN: Mặc định ẨN (opacity: 0) và ĐẨY XUỐNG DƯỚI */
        .logo-label {
            position: absolute;
            top: -10px; /* Đặt vị trí ẩn sát logo */
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            
            /* ĐIỂM CỐT LÕI: Mặc định ẩn hoàn toàn */
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* KHI RÊ CHUỘT / CHẠM VÀO LOGO: Hiện chữ và trượt nhẹ lên trên */
        .logo-card:hover .logo-label,
        .logo-card:active .logo-label {
            opacity: 1;
            visibility: visible;
            top: -45px; /* Trượt ngược lên phía trên đầu logo */
        }

        .logo-card:active .logo-img,
        .logo-card:hover .logo-img {
            transform: scale(1.08);
            border-color: #ffde59;
        }

        /* Responsive xoay ngang */
        @media (orientation: landscape) and (max-height: 500px) {
            .hero-section {
                padding-bottom: 20px;
            }
            .logo-img {
                width: 90px;
                height: 90px;
                border-width: 3px;
            }
            .logo-card:hover .logo-label,
            .logo-card:active .logo-label {
                top: -35px;
            }
        }

        /* Responsive màn hình dọc */
        @media (max-width: 480px) and (orientation: portrait) {
            .logo-img {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="overlay"></div>

        <div class="logos-container">
            <div class="row w-100 justify-content-center align-items-center m-0 g-3">
                
                <!-- LOGO TRÁI -->
                <div class="col-6 text-center p-0">
                    <a href="https://google.com" target="_blank" class="logo-card">
                        <span class="logo-label">Trang chính CA</span>
                        <img src="ca-logo-purple.jpg" alt="CA Logo Normal" class="logo-img">
                    </a>
                </div>

                <!-- LOGO PHẢI -->
                <div class="col-6 text-center p-0">
                    <a href="https://youtube.com" target="_blank" class="logo-card">
                        <span class="logo-label">Khám phá CA Travel</span>
                        <img src="ca-travel-flower.jpg" alt="CA Travel Logo" class="logo-img">
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bundle.min.js"></script>
</body>
</html>
